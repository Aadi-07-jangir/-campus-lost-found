name: campus_lost_found
description: AI-powered Lost & Found system for college campuses.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.5.0
  provider: ^6.1.1
  google_fonts: ^6.1.0
  cached_network_image: ^3.3.1
  image_picker: ^1.0.7
  intl: ^0.19.0
  shared_preferences: ^2.2.3
  permission_handler: ^11.3.0
  url_launcher: ^6.2.3
  path_provider: ^2.1.2
  http: ^1.2.1
  dio: ^5.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
